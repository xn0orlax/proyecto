<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<title>403 - Acceso denegado</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

	<div class="alert alert-danger text-center">
		<h1>🚫 Acceso denegado (403)</h1>

		<p th:text="${message}">
			No tienes permisos para acceder a esta sección.
		</p>

		<p>
			Usuario:
			<strong sec:authentication="name"></strong>
		</p>

		<a href="/orders" class="btn btn-primary mt-3">Volver al inicio</a>


		<th:block sec:authorize="isAuthenticated()">
			<form th:action="@{/logout}" method="post" class="d-inline">
				<button type="submit" class="nav-link btn btn-link text-start w-100 d-flex align-items-center gap-2">
					<i class="bi bi-box-arrow-right"></i>
					<span>Cerrar sesión</span>
				</button>
			</form>
		</li>
	</div>

</body>

</html>
