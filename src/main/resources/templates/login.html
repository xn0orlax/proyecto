<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="icon" th:href="@{/images/icon-restaurant.png}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/styles/css/custom_styles.css}" rel="stylesheet" />
</head>

<body>
	<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
		<div class="card shadow-sm" style="width: 100%; max-width: 400px;">
			<div class="card-body">
				<h3 class="card-title text-center">Login</h3>
				<form th:action="@{/login}" method="post">
					<!-- Username -->
					<div class="mb-3">
						<label for="username" class="form-label">Username</label>
						<input type="text" id="username" name="username" class="form-control"
							placeholder="Enter your username" required>
					</div>

					<!-- Password -->
					<div class="mb-3">
						<label for="password" class="form-label">Password</label>
						<input type="password" id="password" name="password" class="form-control"
							placeholder="Enter your password" required>
					</div>

					<!-- Submit Button -->
					<button type="submit" class="btn btn-primary w-100">Login</button>
				</form>

				<!-- Error Message -->
				<div th:if="${param.error}" class="mt-3 alert alert-danger" role="alert">
					Invalid username or password.
				</div>

				<!-- Logout Message -->
				<div th:if="${param.logout}" class="mt-3 alert alert-success" role="alert">
					You have been logged out successfully.
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS and Popper.js (required for Bootstrap 5) -->
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>

</html>
