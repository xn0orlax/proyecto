<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{layout/layout :: layout}">

<head>
	<title>${title}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<meta charset="UTF-8">
</head>

<body class="container">
	
	<div th:fragment="content">
	
		<h2 th:text="${operation}"></h2>
	
		<form th:action="@{/sizes/save}" th:object="${sizeForm}" method="post">
			<input type="hidden" th:field="*{id}" />
			<div class="mb-3">
				<label>Nombre</label>
				<input class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" />
				<div class="invalid-feedback" th:errors="*{name}"></div>
			</div>
	
			<div class="mb-3">
				<label>Descripción</label>
				<textarea class="form-control" th:field="*{description}"></textarea>
			</div>
			<div class="mb-3 form-check form-switch">
				<input class="form-check-input" type="checkbox" id="flexSwitchCheckChecked" th:field="*{available}">
				<label class="form-check-label" for="flexSwitchCheckChecked">Disponible</label>
			</div>
			<div class="mb-3">
				<button class="btn btn-success mt-3">Guardar</button>
			</div>
		</form>
	
	</div>

</body>

</html>
