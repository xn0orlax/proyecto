<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{layout/layout :: layout}">

<head>
	<title>Tamaños</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<meta charset="UTF-8">
</head>

<body class="container">

	<div th:fragment="content">

		<h2>Tamaños de productos</h2>
		<a th:href="@{/sizes/new}" class="btn btn-primary mb-3">Agregar tamaño</a>

		<table class="table table-hover">
			<thead>
				<tr>
					<th class="w-30" scope="col">Nombre</th>
					<th class="w-25" scope="col">Descripción</th>
					<th class="w-20 text-center" scope="col">Estatus</th>
					<th class="w-25 text-center" scope="col">Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="s : ${sizes}">
					<td>
						<span>[[${s.name}]]</span>
					</td>
					<td>[[${s.description}]]</td>
					<td class="text-center" th:text="${s.available} ? '✅' : '❌'"></td>
					<td class="text-center">
						<a th:href="@{/sizes/edit/{id}(id=${s.id})}" class="btn btn-warning btn-sm">Editar</a>
						<a th:href="@{/sizes/delete/{id}(id=${s.id})}" class="btn btn-danger btn-sm">Eliminar</a>
					</td>
				</tr>
			</tbody>
		</table>

	</div>

</body>

</html>
