<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{layout/layout :: layout}">

<head>
	<title>Productos</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<meta charset="UTF-8">
</head>

<body class="container">
	
	<div th:fragment="content" th:if="${#lists.isEmpty(categories) OR #lists.isEmpty(sizes)}">
		<p th:if="${#lists.isEmpty(categories)}">
			Debes de
			<a th:href="@{/categories/new}" class="mb-3">crear una categoría</a>
			para agregar productos
		</p>
		<p th:if="${#lists.isEmpty(sizes)}">
			Debes de
			<a th:href="@{/sizes/new}" class="mb-3">crear un tamaño</a>
			para agregar productos
		</p>
	</div>
	
	<div th:fragment="content" th:if="${not #lists.isEmpty(categories) AND not #lists.isEmpty(categories)}">
		<h2 th:text="${operation}"></h2>

		<form th:action="@{/products/save}" th:object="${productForm}" method="post">
			<input type="hidden" th:field="*{productId}" />
			<div class="mb-3">
				<label>Nombre</label>
				<input class="form-control" th:field="*{productName}" th:classappend="${#fields.hasErrors('productName')} ? 'is-invalid'" />
				<div class="invalid-feedback" th:errors="*{productName}"></div>
			</div>

			<div class="mb-3">
				<label>Descripción</label>
				<textarea class="form-control" th:field="*{productDescription}"></textarea>
			</div>
			<div class="mb-3">
				<label>Precio</label>
				<input type="number" step="0.01" class="form-control" th:field="*{productPrice}" th:classappend="${#fields.hasErrors('productPrice')} ? 'is-invalid'" />
				<div class="invalid-feedback" th:errors="*{productPrice}"></div>
			</div>
			<div class="mb-3">
				<label class="mb-2">Seleccionar categoría:</label><br>
				<div class="btn-group" role="group">
					<th:block th:each="category, i : ${categories}">
						<input type="radio" class="btn-check" th:field="*{categoryId}" th:id="'category-' + ${category.id}" th:value="${category.id}" autocomplete="off">
						<label class="btn btn-outline-primary" th:for="'category-' + ${category.id}" th:text="${category.name}"></label>
					</th:block>
				</div>
			</div>
			<div class="mb-3">
				<label class="mb-2">Seleccionar tamaño:</label><br>
				<div class="btn-group" role="group">
					<th:block th:each="size, i : ${sizes}">
						<input type="radio" class="btn-check" th:field="*{sizeId}" th:id="'size-' + ${size.id}" th:value="${size.id}" autocomplete="off">
						<label class="btn btn-outline-primary" th:for="'size-' + ${size.id}">[[${size.name + ' (' + size.description + ')'}]]</label>
					</th:block>
				</div>
			</div>
			<div class="mb-3 form-check form-switch">
				<input class="form-check-input" type="checkbox" id="flexSwitchCheckChecked" th:field="*{productStatus}">
				<label class="form-check-label" for="flexSwitchCheckChecked">Disponible</label>
			</div>
			<div class="mb-3">
				<button class="btn btn-success mt-3">Guardar</button>
			</div>
		</form>
	</div>

</body>

</html>
